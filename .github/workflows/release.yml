name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
      - run: task core:build

  macos:
    name: macOS package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
      - name: Set version
        run: if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "VERSION=${GITHUB_REF_NAME#v}"; else echo "VERSION=0.0.0-dev"; fi >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: task macos:build
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/artifacts/md4a-*-macos-universal-unsigned.zip
          if-no-files-found: error

  ios-check:
    name: iOS local package check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
      - name: Set version
        run: if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "VERSION=${GITHUB_REF_NAME#v}"; else echo "VERSION=0.0.0-dev"; fi >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: task ios:build

  android:
    name: Android package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Set version
        run: if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "VERSION=${GITHUB_REF_NAME#v}"; else echo "VERSION=0.0.0-dev"; fi >> "$GITHUB_ENV"
      - name: Install native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - run: task android:build
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            out/artifacts/md4a-*-android-debug.apk
            out/artifacts/md4a-*-android-unsigned.apk
            out/artifacts/md4a-*-android-unsigned.aab
          if-no-files-found: error

  windows:
    name: Windows package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Set version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.Substring(1) } else { "0.0.0-dev" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: task windows:build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/artifacts/md4a-*-windows-x64-unpackaged.zip
          if-no-files-found: error

  linux:
    name: Linux package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
      - name: Set version
        run: if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "VERSION=${GITHUB_REF_NAME#v}"; else echo "VERSION=0.0.0-dev"; fi >> "$GITHUB_ENV"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-4-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev
      - run: task linux:build
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/artifacts/md4a-*-linux-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [core, macos, ios-check, android, windows, linux]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Prepare release notes
        run: |
          cp .github/release-notes.md "$RUNNER_TEMP/release-notes.md"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq .body >> "$RUNNER_TEMP/release-notes.md"
      - name: Publish
        run: |
          args=("${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --title "md4a ${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
