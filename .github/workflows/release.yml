name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}
      - run: task core:build

  macos:
    name: macOS package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}
      - name: Set version
        run: if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "VERSION=${GITHUB_REF_NAME#v}"; else echo "VERSION=0.0.0-dev"; fi >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: task macos:build
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/artifacts/md4a-*-macos-universal-unsigned.zip
          if-no-files-found: error

  ios-check:
    name: iOS local package check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}
      - name: Set version
        run: if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "VERSION=${GITHUB_REF_NAME#v}"; else echo "VERSION=0.0.0-dev"; fi >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: task ios:build

  android:
    name: Android production package
    runs-on: ubuntu-24.04
    environment: android-production
    env:
      MD4A_ANDROID_STORE_PASSWORD: ${{ secrets.MD4A_ANDROID_STORE_PASSWORD }}
      MD4A_ANDROID_KEY_ALIAS: ${{ secrets.MD4A_ANDROID_KEY_ALIAS }}
      MD4A_ANDROID_KEY_PASSWORD: ${{ secrets.MD4A_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Set version
        run: if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "VERSION=${GITHUB_REF_NAME#v}"; else echo "VERSION=0.0.0-dev"; fi >> "$GITHUB_ENV"
      - name: Install native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Prepare production signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MD4A_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing protected secret MD4A_ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          keystore="$RUNNER_TEMP/md4a-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "MD4A_ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
      - name: Build production-signed APK and AAB
        run: task android:release
      - name: Verify APK signer and certificate
        env:
          EXPECTED_SHA256: ${{ secrets.MD4A_ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="out/artifacts/md4a-${VERSION}-android.apk"
          apksigner verify --verbose --print-certs "$apk"
          actual=$(apksigner verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$expected" || { echo "Missing protected secret MD4A_ANDROID_UPLOAD_CERT_SHA256" >&2; exit 1; }
          test "$actual" = "$expected" || { echo "Signer digest mismatch: expected $expected, got $actual" >&2; exit 1; }
      - name: Enable KVM for emulator smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch signed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            apk="out/artifacts/md4a-${VERSION}-android.apk"
            adb install "$apk"
            # A second install exercises Android's same-package, same-certificate upgrade path.
            adb install -r "$apk"
            adb shell am force-stop app.md4a
            adb shell monkey -p app.md4a -c android.intent.category.LAUNCHER 1
            sleep 3
            adb shell pidof app.md4a
      - name: Remove signing material
        if: always()
        run: rm -f "${MD4A_ANDROID_KEYSTORE_FILE:-}"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            out/artifacts/md4a-*-android.apk
            out/artifacts/md4a-*-android.aab
          if-no-files-found: error

  windows:
    name: Windows package
    runs-on: windows-2022
    environment: windows-production
    env:
      MD4A_WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MD4A_WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      MD4A_WINDOWS_SIGNING_PASSWORD: ${{ secrets.MD4A_WINDOWS_SIGNING_PASSWORD }}
      MD4A_WINDOWS_SIGNING_SHA1: ${{ secrets.MD4A_WINDOWS_SIGNING_SHA1 }}
      MD4A_WINDOWS_TIMESTAMP_URL: ${{ vars.MD4A_WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Set version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.Substring(1) } else { "0.0.0-dev" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Import Authenticode certificate
        if: env.MD4A_WINDOWS_SIGNING_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "md4a-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:MD4A_WINDOWS_SIGNING_CERTIFICATE_BASE64))
          "MD4A_WINDOWS_SIGNING_CERTIFICATE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: task windows:build
      - name: Install, launch, and uninstall smoke test
        shell: pwsh
        run: |
          $setup = Get-ChildItem out/artifacts/md4a-*-windows-x64-setup-*.exe | Select-Object -Single
          ./tools/windows-smoke.ps1 -SetupPath $setup.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/artifacts/md4a-*-windows-x64-setup-*.exe
            out/artifacts/md4a-*-windows-x64-unpackaged.zip
          if-no-files-found: error

  linux:
    name: Linux package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}
      - name: Set version
        run: if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "VERSION=${GITHUB_REF_NAME#v}"; else echo "VERSION=0.0.0-dev"; fi >> "$GITHUB_ENV"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-4-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev
      - run: task linux:build
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/artifacts/md4a-*-linux-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [core, macos, ios-check, android, windows, linux]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Prepare release notes
        run: |
          cp .github/release-notes.md "$RUNNER_TEMP/release-notes.md"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq .body >> "$RUNNER_TEMP/release-notes.md"
      - name: Publish
        run: |
          args=("${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --title "md4a ${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
