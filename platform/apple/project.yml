name: md4a
options:
  bundleIdPrefix: app.md4a
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_C_LANGUAGE_STANDARD: c11
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../../core/include"
      - "$(SRCROOT)/../../third_party/md4c/src"
    SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Shared/md4a-Bridging-Header.h"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  md4aMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
      - path: ../../core/src/md4a.c
      - path: ../../third_party/md4c/src/md4c.c
      - path: ../../third_party/md4c/src/md4c-html.c
      - path: ../../third_party/md4c/src/entity.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.md4a.macos
        PRODUCT_MODULE_NAME: md4aMac
        PRODUCT_NAME: md4a
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
              public.mime-type: text/markdown
    scheme:
      testTargets:
        - md4aMacTests

  md4aiOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
      - path: ../../core/src/md4a.c
      - path: ../../third_party/md4c/src/md4c.c
      - path: ../../third_party/md4c/src/md4c-html.c
      - path: ../../third_party/md4c/src/entity.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.md4a.ios
        PRODUCT_MODULE_NAME: md4aiOS
        PRODUCT_NAME: md4a
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
              public.mime-type: text/markdown
    scheme:
      testTargets:
        - md4aiOSTests

  md4aMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: md4aMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.md4a.macos.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/md4a.app/Contents/MacOS/md4a"
        BUNDLE_LOADER: "$(TEST_HOST)"

  md4aiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: md4aiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.md4a.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/md4a.app/md4a"
        BUNDLE_LOADER: "$(TEST_HOST)"
